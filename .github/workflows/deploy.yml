name: Build & Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    uses: vioaki/Prompt-Manager/.github/workflows/reusable-deploy.yml@pages-v1.0.1
    with:
      engine_ref: pages-v1.0.1
    permissions:
      contents: read
      pages: write
      id-token: write
