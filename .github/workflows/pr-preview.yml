name: PR Content Validation & AI Preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'content/**'
      - 'site.config.json'

jobs:
  preview:
    uses: vioaki/Prompt-Manager/.github/workflows/reusable-pr-check.yml@pages-v1.0.0
    with:
      engine_ref: pages-v1.0.0
    permissions:
      contents: read
      pull-requests: write
    secrets:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
